# Portable standalone stack; set public URL/domain via ZITADEL_PUBLIC_URL and
# ZITADEL_EXTERNALDOMAIN outside Coolify. Coolify overrides them with magic URL.
services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: zitadel
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.1.10-alpine
    restart: unless-stopped
    user: "999:1000"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'user default on >%s ~* &* +@all\n' "$$VALKEY_PASSWORD" > /tmp/valkey-users.acl
        exec valkey-server --aclfile /tmp/valkey-users.acl --databases 32 --appendonly yes
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$VALKEY_PASSWORD\" valkey-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  zitadel-api:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cat > /tmp/Caddyfile <<'CADDY'
        {
            auto_https off
            admin off
            servers :8080 {
                protocols h1 h2c
            }
        }
        :8080 {
            @login path /ui/v2/login /ui/v2/login/*
            handle @login {
                reverse_proxy zitadel-login:3000 {
                    header_up X-Forwarded-Proto https
                }
            }
            handle {
                reverse_proxy h2c://zitadel-core:8080 {
                    header_up -TE
                    header_up X-Forwarded-Proto https
                }
            }
        }
        CADDY
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    depends_on:
      zitadel-core:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ui/v2/login/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  zitadel-core:
    image: ghcr.io/zitadel/zitadel:v4.20.0
    user: "0" # Root-owned shared bootstrap volume: PAT writer/reader (no host mounts).
    restart: unless-stopped
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "disabled"]
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?}
      ZITADEL_PORT: "8080"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-8080}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/zitadel?sslmode=disable
      # Enable real Redis-compatible ZITADEL caches; /0 in URI is not DB selection.
      ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED: "true"
      ZITADEL_CACHES_CONNECTORS_REDIS_URL: redis://default:${VALKEY_PASSWORD:?}@valkey:6379/0
      ZITADEL_CACHES_CONNECTORS_REDIS_DBOFFSET: "10"
      ZITADEL_CACHES_INSTANCE_CONNECTOR: redis
      ZITADEL_CACHES_MILESTONES_CONNECTOR: redis
      ZITADEL_CACHES_ORGANIZATION_CONNECTOR: redis
      # Native ZITADEL v4.20 OTLP exporters; disabled until configured.
      ZITADEL_INSTRUMENTATION_SERVICENAME: zitadel
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE: ${ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE:-none}
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_ENDPOINT: ${OTEL_ENDPOINT:-}
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_INSECURE: ${ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_INSECURE:-false}
      ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_TYPE: ${ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_TYPE:-none}
      ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_ENDPOINT: ${OTEL_ENDPOINT:-}
      ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_INSECURE: ${ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_INSECURE:-false}
      ZITADEL_INSTRUMENTATION_LOG_EXPORTER_TYPE: ${ZITADEL_INSTRUMENTATION_LOG_EXPORTER_TYPE:-none}
      ZITADEL_INSTRUMENTATION_LOG_EXPORTER_ENDPOINT: ${OTEL_ENDPOINT:-}
      ZITADEL_INSTRUMENTATION_LOG_EXPORTER_INSECURE: ${ZITADEL_INSTRUMENTATION_LOG_EXPORTER_INSECURE:-false}
      ZITADEL_INSTRUMENTATION_LOG_STDERR: json
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-zitadel-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?}
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Infisical-independent Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ${ZITADEL_PUBLIC_URL:-http://localhost:8080}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: ${ZITADEL_PUBLIC_URL:-http://localhost:8080}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: ${ZITADEL_PUBLIC_URL:-http://localhost:8080}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: ${ZITADEL_PUBLIC_URL:-http://localhost:8080}/ui/v2/login/login?samlRequest=
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.20.0
    user: "0" # Root-owned shared bootstrap volume: PAT writer/reader (no host mounts).
    restart: unless-stopped
    environment:
      ZITADEL_API_URL: http://zitadel-core:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_SESSION_COOKIE_SECRET:?}
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_EXTERNALDOMAIN:-localhost},X-Forwarded-Proto:${ZITADEL_PUBLIC_SCHEME:-http}
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s


volumes:
  postgres-data:
  valkey-data:
  zitadel-bootstrap:
