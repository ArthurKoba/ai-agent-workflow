# Coolify Traefik routes API over h2c and Login V2 over HTTP on the one API domain.
services:
  postgres:
    extends:
      file: ./docker-compose.yaml
      service: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DATABASE:-zitadel}

  valkey:
    extends:
      file: ./docker-compose.yaml
      service: valkey
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}

  zitadel-api:
    extends:
      file: ./docker-compose.yaml
      service: zitadel-api
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.zitadel-api-h2c.rule=Host(`${SERVICE_FQDN_ZITADEL_API_8080}`)'
      - 'traefik.http.routers.zitadel-api-h2c.entrypoints=https'
      - 'traefik.http.routers.zitadel-api-h2c.tls=true'
      - 'traefik.http.routers.zitadel-api-h2c.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.zitadel-api-h2c.priority=100'
      - 'traefik.http.routers.zitadel-api-h2c.service=zitadel-api-h2c'
      - 'traefik.http.services.zitadel-api-h2c.loadbalancer.server.port=8080'
      - 'traefik.http.services.zitadel-api-h2c.loadbalancer.server.scheme=h2c'
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "external"]
    environment:
      SERVICE_URL_ZITADEL_API_8080: /
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?}
      # HTTPS is terminated by Coolify; use ZITADEL's external TLS mode.
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_EXTERNALDOMAIN: ${SERVICE_FQDN_ZITADEL_API_8080}
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD:?}@database:5432/${POSTGRES_DATABASE:-zitadel}?sslmode=disable
      # Enable real Redis-compatible ZITADEL caches; /0 in URI is not DB selection.
      ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED: "true"
      ZITADEL_CACHES_CONNECTORS_REDIS_URL: redis://default:${VALKEY_PASSWORD:?}@valkey:6379/0
      ZITADEL_CACHES_CONNECTORS_REDIS_DBOFFSET: "10"
      ZITADEL_CACHES_INSTANCE_CONNECTOR: redis
      ZITADEL_CACHES_MILESTONES_CONNECTOR: redis
      ZITADEL_CACHES_ORGANIZATION_CONNECTOR: redis
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${SERVICE_FQDN_ZITADEL_API_8080}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${SERVICE_FQDN_ZITADEL_API_8080}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${SERVICE_FQDN_ZITADEL_API_8080}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${SERVICE_FQDN_ZITADEL_API_8080}/ui/v2/login/login?samlRequest=

  zitadel-login:
    extends:
      file: ./docker-compose.yaml
      service: zitadel-login
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.zitadel-login-v2.rule=Host(`${SERVICE_FQDN_ZITADEL_API_8080}`) && PathPrefix(`/ui/v2/login`)'
      - 'traefik.http.routers.zitadel-login-v2.entrypoints=https'
      - 'traefik.http.routers.zitadel-login-v2.tls=true'
      - 'traefik.http.routers.zitadel-login-v2.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.zitadel-login-v2.priority=200'
      - 'traefik.http.routers.zitadel-login-v2.service=zitadel-login-http'
      - 'traefik.http.services.zitadel-login-http.loadbalancer.server.port=3000'
    environment:
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_SESSION_COOKIE_SECRET:?}
      CUSTOM_REQUEST_HEADERS: Host:${SERVICE_FQDN_ZITADEL_API_8080},X-Forwarded-Proto:https


volumes:
  postgres-data:
  valkey-data:
  zitadel-bootstrap:
