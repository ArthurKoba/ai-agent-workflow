# One Coolify URL on the Caddy ingress; Core and Login V2 stay private.
# Attach to the real predefined network of database and valkey dependencies.
services:
  zitadel-api:
    extends:
      file: ./docker-compose.yaml
      service: zitadel-api
    environment:
      SERVICE_URL_ZITADEL_API_8080: /

  zitadel-core:
    extends:
      file: ./docker-compose.yaml
      service: zitadel-core
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "external"]
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?}
      # HTTPS is terminated by Coolify; use ZITADEL's external TLS mode.
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_EXTERNALDOMAIN: ${SERVICE_FQDN_ZITADEL_API:?}
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://${POSTGRES_USERNAME:-zitadel}:${POSTGRES_PASSWORD:?}@database:5432/${POSTGRES_DATABASE:-zitadel}?sslmode=disable
      # Enable real Redis-compatible ZITADEL caches; /0 in URI is not DB selection.
      ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED: "true"
      ZITADEL_CACHES_CONNECTORS_REDIS_URL: redis://${VALKEY_USERNAME:-zitadel}:${VALKEY_PASSWORD:?}@valkey:6379/0
      ZITADEL_CACHES_CONNECTORS_REDIS_DBOFFSET: ${VALKEY_DATABASE_OFFSET:-10}
      ZITADEL_CACHES_INSTANCE_CONNECTOR: redis
      ZITADEL_CACHES_MILESTONES_CONNECTOR: redis
      ZITADEL_CACHES_ORGANIZATION_CONNECTOR: redis
      # Native ZITADEL v4.20 OTLP exporters; disabled until configured.
      ZITADEL_INSTRUMENTATION_SERVICENAME: zitadel
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE: ${ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE:-none}
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_ENDPOINT: ${OTEL_ENDPOINT:-}
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_INSECURE: ${ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_INSECURE:-false}
      ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_TYPE: ${ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_TYPE:-none}
      ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_ENDPOINT: ${OTEL_ENDPOINT:-}
      ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_INSECURE: ${ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_INSECURE:-false}
      ZITADEL_INSTRUMENTATION_LOG_EXPORTER_TYPE: ${ZITADEL_INSTRUMENTATION_LOG_EXPORTER_TYPE:-none}
      ZITADEL_INSTRUMENTATION_LOG_EXPORTER_ENDPOINT: ${OTEL_ENDPOINT:-}
      ZITADEL_INSTRUMENTATION_LOG_EXPORTER_INSECURE: ${ZITADEL_INSTRUMENTATION_LOG_EXPORTER_INSECURE:-false}
      ZITADEL_INSTRUMENTATION_LOG_STDERR: json
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${SERVICE_FQDN_ZITADEL_API:?}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${SERVICE_FQDN_ZITADEL_API:?}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${SERVICE_FQDN_ZITADEL_API:?}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${SERVICE_FQDN_ZITADEL_API:?}/ui/v2/login/login?samlRequest=

  zitadel-login:
    extends:
      file: ./docker-compose.yaml
      service: zitadel-login
    environment:
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_SESSION_COOKIE_SECRET:?}
      CUSTOM_REQUEST_HEADERS: Host:${SERVICE_FQDN_ZITADEL_API:?},X-Forwarded-Proto:https

volumes:
  zitadel-bootstrap:
    driver: local
