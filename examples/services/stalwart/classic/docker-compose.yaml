# Classic: one-shot bootstrap applies OIDC/OTLP when their ENV inputs are present.
services:
  stalwart:
    image: stalwartlabs/stalwart:v1.0.3
    init: true
    restart: unless-stopped
    environment:
      STALWART_HOSTNAME: ${STALWART_HOSTNAME:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
    volumes:
    - stalwart-etc:/etc/stalwart
    - stalwart-data:/var/lib/stalwart
    ports:
    - ${STALWART_SMTP_HOST_PORT:-25}:25
    - ${STALWART_SUBMISSIONS_HOST_PORT:-465}:465
    - ${STALWART_SUBMISSION_HOST_PORT:-587}:587
    - ${STALWART_IMAPS_HOST_PORT:-993}:993
    - 127.0.0.1:${STALWART_HTTP_HOST_PORT:-18080}:8080
    expose:
    - '8080'
    hostname: ${STALWART_HOSTNAME:?}
    depends_on:
      stalwart-postgres:
        condition: service_healthy
      stalwart-valkey:
        condition: service_healthy
  stalwart-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stalwart
      POSTGRES_DB: stalwart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U stalwart -d stalwart
      interval: 10s
      timeout: 5s
      retries: 12
  stalwart-valkey:
    image: valkey/valkey:9.1.0-alpine
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
    command:
    - /bin/sh
    - -ec
    - 'umask 077

      printf ''user default on >%s ~* &* +@all\n'' "$$VALKEY_PASSWORD" > /tmp/valkey-users.acl

      exec valkey-server --aclfile /tmp/valkey-users.acl --appendonly yes --maxmemory-policy
      noeviction

      '
    volumes:
    - valkey-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - VALKEYCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -qx PONG
      interval: 10s
      timeout: 5s
      retries: 12
  bootstrap:
    build:
      context: .
      dockerfile_inline: |
        FROM ghcr.io/stalwartlabs/cli:1.0.14 AS cli
        FROM python:3.14-alpine
        COPY --from=cli /usr/local/bin/stalwart-cli /usr/local/bin/stalwart-cli
        ENV HOME=/tmp
        USER 65532:65532
    init: true
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=32m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    depends_on:
      stalwart:
        condition: service_healthy
    environment:
      STALWART_URL: ${STALWART_URL:-}
      STALWART_TOKEN: ${STALWART_TOKEN:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-email}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      WEBUI_APPLICATION_ID: ${WEBUI_APPLICATION_ID:-}
      MAIL_PUBLIC_URL: ${MAIL_PUBLIC_URL:-}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_NAMESPACE: ${OTEL_NAMESPACE:-}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:-}
    entrypoint:
    - python3
    - -c
    command:
    - |
      import json, os, subprocess
      from urllib.parse import urlsplit

      def val(name):
          return os.environ.get(name, "").strip()

      def require(name):
          x = val(name)
          if not x:
              raise SystemExit("bootstrap: missing required " + name)
          return x

      def secure(name, origin=False):
          x = require(name).rstrip("/")
          u = urlsplit(x)
          try:
              port = u.port
          except ValueError:
              raise SystemExit("bootstrap: invalid HTTPS URL for " + name)
          if (u.scheme != "https" or not u.hostname or u.username or u.password
                  or u.query or u.fragment or port == 0
                  or (origin and u.path not in ("", "/"))):
              raise SystemExit("bootstrap: " + name + " must be a valid HTTPS URL")
          return x

      issuer = val("OIDC_ISSUER_URL")
      audience = val("OIDC_AUDIENCE")
      client = val("OIDC_CLIENT_ID")
      webui = val("WEBUI_APPLICATION_ID")
      public = val("MAIL_PUBLIC_URL")
      endpoint = val("OTEL_ENDPOINT")
      oidc_on = bool(issuer)
      otel_on = bool(endpoint)
      if not oidc_on and any((audience, client, webui, public)):
          raise SystemExit("bootstrap: OIDC_ISSUER_URL is required with OIDC parameters")
      if oidc_on and not audience:
          raise SystemExit("bootstrap: OIDC_AUDIENCE is required with OIDC_ISSUER_URL")
      if client and (not webui or not public):
          raise SystemExit("bootstrap: OIDC_CLIENT_ID needs WEBUI_APPLICATION_ID and MAIL_PUBLIC_URL")
      if oidc_on and not client and any((webui, public)):
          raise SystemExit("bootstrap: WEBUI_APPLICATION_ID/MAIL_PUBLIC_URL require OIDC_CLIENT_ID")
      if not oidc_on and not otel_on:
          print("bootstrap: no OIDC or OpenTelemetry config; nothing to apply")
          raise SystemExit(0)

      secure("STALWART_URL")
      require("STALWART_TOKEN")
      plan = []
      if oidc_on:
          directory={"@type":"Oidc","description":"External OpenID Connect",
                     "issuerUrl":secure("OIDC_ISSUER_URL"),
                     "claimUsername":val("OIDC_USERNAME_CLAIM") or "email",
                     "requireAudience":audience,
                     "requireScopes":{"openid":True,"email":True}}
          plan.append({"@type":"upsert","object":"Directory","matchOn":["description"],
                       "value":{"external-oidc":directory}})
          if client:
              origin=secure("MAIL_PUBLIC_URL",origin=True)
              recovery={"clientId":client,"description":"WebUI recovery client",
                        "redirectUris":{origin+"/admin/oauth/callback":True,
                                        origin+"/account/oauth/callback":True},
                        "scopes":{"full":True}}
              plan.extend([
                  {"@type":"upsert","object":"OAuthClient","matchOn":["clientId"],
                   "value":{"webui-recovery":recovery}},
                  {"@type":"update","object":"Application","id":webui,
                   "value":{"oauthClientId":client,
                            "oauthScopes":{"urn:stalwart:oauth:scope:full":True}}}
              ])
          plan.append({"@type":"update","object":"Authentication",
                       "value":{"directoryId":"#external-oidc"}})

      if otel_on:
          otlp=secure("OTEL_ENDPOINT")
          auth={}
          if val("OTEL_BEARER_TOKEN"):
              auth={"httpAuth":{"@type":"Bearer","bearerToken":{
                     "@type":"EnvironmentVariable","variableName":"OTEL_BEARER_TOKEN"}}}
          def tracer(suffix, logs, spans):
              return {"@type":"OtelHttp","url":otlp+suffix,
                      "enableLogExporter":logs,"enableSpanExporter":spans,
                      "allowInvalidCerts":False,"level":"info",**auth}
          metrics={"serviceName":"stalwart","openTelemetry":{
                    "@type":"Http","url":otlp,"interval":60000,
                    "allowInvalidCerts":False,**auth}}
          if val("OTEL_NAMESPACE"):
              metrics["serviceNamespace"]=val("OTEL_NAMESPACE")
          if val("DEPLOYMENT_ENVIRONMENT"):
              metrics["resourceAttributes"]={"deployment.environment.name":val("DEPLOYMENT_ENVIRONMENT")}
          plan.extend([
              {"@type":"upsert","object":"Tracer","matchOn":["url"],
               "value":{"otel-logs":tracer("/v1/logs",True,False),
                        "otel-traces":tracer("/v1/traces",False,True)}},
              {"@type":"update","object":"Metrics","value":metrics}
          ])

      payload="\n".join(json.dumps(obj,separators=(",",":")) for obj in plan)+"\n"
      cli="/usr/local/bin/stalwart-cli"
      for argv in (["apply","--stdin","--dry-run"],
                   ["apply","--stdin"],["create","Action/ReloadSettings"]):
          subprocess.run([cli]+argv,input=payload if "--stdin" in argv else None,
                         text=True,check=True)
      print("bootstrap: applied configured integrations")
volumes:
  stalwart-etc: null
  stalwart-data: null
  postgres-data: null
  valkey-data: null
