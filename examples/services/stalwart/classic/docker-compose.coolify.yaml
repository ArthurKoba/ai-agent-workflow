# Coolify entrypoint; run configure profile explicitly after first setup.
services:
  stalwart:
    extends:
      file: ./docker-compose.yaml
      service: stalwart
    environment:
      STALWART_HOSTNAME: ${STALWART_HOSTNAME:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
      OTEL_BEARER_TOKEN: ${OTEL_BEARER_TOKEN:?}
      STALWART_SMTP_HOST_PORT: ${STALWART_SMTP_HOST_PORT:-25}
      STALWART_SUBMISSIONS_HOST_PORT: ${STALWART_SUBMISSIONS_HOST_PORT:-465}
      STALWART_SUBMISSION_HOST_PORT: ${STALWART_SUBMISSION_HOST_PORT:-587}
      STALWART_IMAPS_HOST_PORT: ${STALWART_IMAPS_HOST_PORT:-993}
      STALWART_HTTP_HOST_PORT: ${STALWART_HTTP_HOST_PORT:-18080}
  stalwart-postgres:
    extends:
      file: ./docker-compose.yaml
      service: stalwart-postgres
    environment:
      POSTGRES_USER: stalwart
      POSTGRES_DB: stalwart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  stalwart-valkey:
    extends:
      file: ./docker-compose.yaml
      service: stalwart-valkey
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?}
  bootstrap:
    extends:
      file: ./docker-compose.yaml
      service: bootstrap
    profiles:
    - configure
    environment:
      STALWART_URL: ${STALWART_URL:-}
      STALWART_TOKEN: ${STALWART_TOKEN:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-email}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_ACTIVATE: ${OIDC_ACTIVATE:-false}
      WEBUI_APPLICATION_ID: ${WEBUI_APPLICATION_ID:-}
      MAIL_PUBLIC_URL: ${MAIL_PUBLIC_URL:-}
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:-}
      OTEL_NAMESPACE: ${OTEL_NAMESPACE:-}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-}
volumes:
  stalwart-etc:
    driver: local
  stalwart-data:
    driver: local
  postgres-data:
    driver: local
  valkey-data:
    driver: local
