services:
  zoomies:
    image: ghcr.io/eyupio/zoomies:v1.3.4
    restart: unless-stopped
    command:
      - controller
    stop_grace_period: 20m
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 512

    environment:
      ZOOMIES_EXTERNAL_URL: ${ZOOMIES_EXTERNAL_URL:?}
      ZOOMIES_ENCRYPTION_KEY: ${ZOOMIES_ENCRYPTION_KEY:?}
      ZOOMIES_BIND: 0.0.0.0:8080
      ZOOMIES_TLS_MODE: "off"
      ZOOMIES_AGENT_EMBEDDED: "false"
      ZOOMIES_LOG_FORMAT: json

    expose:
      - "8080"

    volumes:
      - zoomies-controller-data:/var/lib/zoomies

    healthcheck:
      test:
        - CMD
        - /usr/local/bin/zoomies
        - healthcheck
        - --url
        - http://127.0.0.1:8080
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    security_opt:
      - no-new-privileges:true

volumes:
  zoomies-controller-data:
