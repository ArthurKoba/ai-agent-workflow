services:
  jenkins:
    image: jenkins/jenkins:latest
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 2g
    pids_limit: 512

    environment:
      - SERVICE_URL_JENKINS_8080

    volumes:
      - jenkins-home:/var/jenkins_home

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8080/login
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ci-builder-01:
    image: jenkins/inbound-agent:jdk21
    restart: unless-stopped
    init: true
    cpus: "0.5"
    mem_limit: 768m
    pids_limit: 256

    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET:-bootstrap-pending}
      JENKINS_AGENT_NAME: ci-builder-01
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      JENKINS_WEB_SOCKET: "true"

      DOCKER_HOST: tcp://ci-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client

      PATH: /opt/docker-cli:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    volumes:
      - ci-workspace:/home/jenkins/agent
      - ci-cache:/cache
      - docker-cli:/opt/docker-cli:ro
      - ci-docker-tls:/certs:ro

    depends_on:
      jenkins:
        condition: service_healthy
      ci-docker:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

  ci-docker:
    image: docker:29.8.2-dind
    restart: unless-stopped
    privileged: true
    cpus: "2.0"
    mem_limit: 4g
    pids_limit: 2048

    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: "DNS:ci-docker"

    entrypoint:
      - /bin/sh
      - -ec

    command:
      - |
        mkdir -p /docker-cli
        cp /usr/local/bin/docker /docker-cli/docker
        chmod 0555 /docker-cli/docker

        exec /usr/local/bin/dockerd-entrypoint.sh \
          --storage-driver=overlay2 \
          --log-driver=local

    volumes:
      - ci-docker-data:/var/lib/docker
      - ci-workspace:/home/jenkins/agent
      - ci-cache:/cache
      - docker-cli:/docker-cli
      - ci-docker-tls:/certs

    healthcheck:
      test:
        - CMD-SHELL
        - DOCKER_HOST=tcp://127.0.0.1:2376 DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH=/certs/client docker info >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  jenkins-home:
  ci-workspace:
  ci-cache:
  ci-docker-data:
  docker-cli:
  ci-docker-tls:
