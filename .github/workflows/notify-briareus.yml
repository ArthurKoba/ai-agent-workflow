name: Notify Briareus on every main push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require configured Briareus dispatch token
        env:
          GH_TOKEN: ${{ secrets.BRIAREUS_DISPATCH_TOKEN }}
        run: |
          if test -z "$GH_TOKEN"; then
            echo '::error::Missing Actions secret BRIAREUS_DISPATCH_TOKEN'
            exit 1
          fi

      - name: Send repository_dispatch to Briareus
        env:
          GH_TOKEN: ${{ secrets.BRIAREUS_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          # Manual dispatch means full refresh; comparing SHA with itself skips it.
          SOURCE_BEFORE: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
          SOURCE_AFTER: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/ai-agent-dispatch.json"
          import json
          import os

          print(json.dumps({
              "event_type": "ai_agent_workflow_updated",
              "client_payload": {
                  "repository": os.environ["SOURCE_REPOSITORY"],
                  "ref": os.environ["SOURCE_REF"],
                  "before": os.environ["SOURCE_BEFORE"],
                  "after": os.environ["SOURCE_AFTER"],
                  "run_id": os.environ["SOURCE_RUN_ID"],
              },
          }))
          PY
          gh api --method POST repos/KobaProduction/Briareus/dispatches \
            --input "$RUNNER_TEMP/ai-agent-dispatch.json"
          echo 'Sent AI Agent Workflow push event to Briareus.'
